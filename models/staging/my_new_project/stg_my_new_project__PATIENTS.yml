models:
  - name: stg_my_new_project__PATIENTS
    description: Patient dimension-style staging model with one row per patient.
    semantic_model:
      enabled: true
      name: patients

    agg_time_dimension: created_at

    columns:
      - name: patient_id
        description: Unique identifier for a patient.
        data_tests:
          - not_null
          - unique
        entity:
          type: primary
          name: patient

      - name: first_name
        description: Patient first name.

      - name: last_name
        description: Patient last name.

      - name: date_of_birth
        description: Patient date of birth.
        granularity: day
        dimension:
          type: time

      - name: gender
        description: Patient gender.
        dimension:
          type: categorical

      - name: city
        description: Patient city.
        dimension:
          type: categorical

      - name: state
        description: Patient state.
        dimension:
          type: categorical

      - name: zip_code
        description: Patient ZIP code.
        dimension:
          type: categorical

      - name: created_at
        description: Timestamp when the patient record was created.
        granularity: day
        dimension:
          type: time

      - name: updated_at
        description: Timestamp when the patient record was last updated.
        granularity: day
        dimension:
          type: time

    metrics:
      - name: patient_count
        description: Count of patients.
        label: Patient Count
        type: simple
        agg: count_distinct
        expr: patient_id
